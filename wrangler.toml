# Cloudflare Pages 설정 (정적 사이트 + Functions)
name = "unitconnect-cmo-analyze"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# 프로젝트(현장) 저장용 KV 네임스페이스.
# 아래 id는 `npx wrangler kv namespace create PROJECTS` 실행 후 출력된 값으로 교체하세요.
[[kv_namespaces]]
binding = "PROJECTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
